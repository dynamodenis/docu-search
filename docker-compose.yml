# Local dev orchestrator. Qdrant lives in Qdrant Cloud — pointed at via
# QDRANT_URL in .env — so we do not run it here.
#
# Usage:
#     docker compose up --build
#     # frontend → http://localhost:5173
#     # backend  → http://localhost:8000

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    environment:
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: "8000"
      # Allow the in-compose frontend container to call us.
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173,http://frontend:5173
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    env_file: .env
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        # Browser-side URL. Use your Hugging Face backend URL here when deploying elsewhere.
        VITE_BACKEND_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped
